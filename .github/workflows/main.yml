name: CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker build -t exercise-log-api:latest ./backend
      - name: Create external docker network
        run: >
          docker network create docker_test_network || echo "Network already
          exists"
      - name: Run Docker container in detached mode
        run: |
          docker compose -f ./backend/docker-compose.yml up -d
        env:
          DB_USER: postgres_user
          DB_PASSWORD: postgres_password
          DB_PORT: 5432
          DB_DATABASE: exercise_log_development
          DOCKER_NETWORK_BACKEND: docker_test_network
      - name: Check node server status
        run: >
          sleep 20  # Wait for server to start

          curl -f http://localhost:3000 || (echo "Node server did not start" &&
          exit 1)
      - name: Stop and remove Docker container
        run: |
          docker compose -f ./backend/docker-compose.yml down
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            jordanmarchetto/exercise-log-api:${{ github.run_number }}
            jordanmarchetto/exercise-log-api:latest
          context: .
      - name: Create and Push Tag
        run: |
          TAG_NAME="v${{ github.run_number }}"
          echo "Creating tag: $TAG_NAME"

          # Check if the tag already exists locally to prevent errors on re-runs
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag $TAG_NAME
            git push origin $TAG_NAME
          else
            echo "Tag $TAG_NAME already exists, skipping creation and push."
          fi
