openapi: 3.0.3
info:
  title: exercise-log-js API
  version: 0.1.0
  description: Public API documentation for exercise-log-js.
servers:
  - url: http://localhost:3000
paths:
  /api/exercises:
    get:
      summary: list all exercises
      description: pulls all exercises from the db and returns them as an array under the `exercises` key
      responses:
        '200':
          description: A list of exercises
          content:
            application/json:
              schema:
                type: object
                properties:
                  exercises:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Bench Press
                        description:
                          type: string
                          example: A compound exercise that targets the chest, shoulders, and triceps.
                        created_at:
                          type: string
                          format: date-time
                          example: '2024-06-01T12:00:00Z'
                        updated_at:
                          type: string
                          format: date-time
                          example: '2024-06-01T12:00:00Z'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: An unexpected error occurred while fetching exercises.
  /api/exercises/{id}:
    get:
      summary: Get a specific exercise by ID
      description: Fetches a single exercise from the database based on the provided ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The unique identifier of the exercise to retrieve.
      responses:
        '200':
          description: Exercise found and returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Bench Press
                  description:
                    type: string
                    example: A compound exercise that targets the chest, shoulders, and triceps.
                  created_at:
                    type: string
                    format: date-time
                    example: '2024-06-01T12:00:00Z'
                  updated_at:
                    type: string
                    format: date-time
                    example: '2024-06-01T12:00:00Z'
        '404':
          description: Exercise not found with the given ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: No exercise found with ID 999.
        '500':
          description: Server error while fetching the exercise
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: An unexpected error occurred while fetching the exercise.
  /api/health:
    get:
      summary: Check API and database health
      description: Returns whether the API is running and whether the database connection is healthy.
      responses:
        '200':
          description: API and database are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                required:
                  - status
                  - database
        '500':
          description: Database connection failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  database:
                    type: string
                    example: disconnected
                required:
                  - status
                  - database
