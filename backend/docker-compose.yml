services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-exercise_log_development}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - exercise_log_pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-exercise_log_development} -h localhost -p ${DB_PORT:-5432}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    environment:
      API_PORT: ${API_PORT:-3000}
      DB_DATABASE: ${DB_DATABASE:-exercise_log_development}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${EXTERNAL_API_PORT:-3000}:3000'
    networks:
      - app_backend

volumes:
  exercise_log_pgdata:

networks:
  app_backend:
    name: ${DOCKER_NETWORK_BACKEND:-exercise-log-backend}
    internal: true

